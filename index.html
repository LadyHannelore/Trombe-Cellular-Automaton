<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trombe Cellular Automaton</title>
<style>
  body { margin: 0; background: #1b2a1b; color: #ddd; font-family: sans-serif; text-align: center; }
  canvas { background: #3b5a2b; margin-top: 8px; cursor: crosshair; image-rendering: pixelated; }
  button, label { margin: 6px; }
</style>
</head>
<body>
<div>
  <button id="play">Pause</button>
  <button id="clear">Clear all</button>
  <label>Mode:
    <select id="mode">
      <option value="seed">Plant trombe seeds</option>
      <option value="erase">Clear cells</option>
    </select>
  </label>
  <label>Spread <input id="rate" type="range" min="0.02" max="0.6" step="0.02" value="0.2"></label>
</div>
<canvas id="c" width="800" height="600"></canvas>
<p>Click/drag: a trombe fruit pops into seeds that spread, draining mana (ground turns gray). Switch to "Clear cells" to remove them.</p>
<script>
const CELL = 10, W = 80, H = 60;
// 0 = fertile ground, 1 = seed/sprout, 2 = drained gray ground
let grid = new Uint8Array(W * H), age = new Uint8Array(W * H);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const img = new Image(); img.src = 'trombe.webp';
let running = true;

function idx(x, y) { return y * W + x; }

function step() {
  const rate = +document.getElementById('rate').value;
  const next = grid.slice(), nage = age.slice();
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = idx(x, y), s = grid[i];
    if (s === 1) {
      nage[i] = Math.min(255, age[i] + 1);
      // sprouts exhaust mana: old seeds drain the ground gray
      if (age[i] > 6 && Math.random() < 0.15) { next[i] = 2; }
    } else {
      let n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && ny >= 0 && nx < W && ny < H && grid[idx(nx, ny)] === 1) n++;
      }
      // gray ground still holds a little mana: harder to colonise
      if (n && Math.random() < rate * n * (s === 2 ? 0.3 : 1)) { next[i] = 1; nage[i] = 0; }
    }
  }
  grid = next; age = nage;
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const s = grid[idx(x, y)];
    if (s === 2) { ctx.fillStyle = '#777'; ctx.fillRect(x * CELL, y * CELL, CELL, CELL); }
    else if (s === 1) {
      if (img.complete && img.naturalWidth) ctx.drawImage(img, x * CELL, y * CELL, CELL, CELL);
      else { ctx.fillStyle = '#c4f'; ctx.fillRect(x * CELL, y * CELL, CELL, CELL); }
    }
  }
}

function pos(e) {
  const r = cv.getBoundingClientRect();
  return [Math.floor((e.clientX - r.left) * W / r.width), Math.floor((e.clientY - r.top) * H / r.height)];
}

function apply(e) {
  const [cx, cy] = pos(e), erase = document.getElementById('mode').value === 'erase';
  const R = erase ? 2 : 1;
  for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
    const x = cx + dx, y = cy + dy;
    if (x < 0 || y < 0 || x >= W || y >= H) continue;
    const i = idx(x, y);
    if (erase) { grid[i] = 0; age[i] = 0; }
    else if (Math.random() < 0.6) { grid[i] = 1; age[i] = 0; }
  }
  draw();
}

let down = false;
cv.addEventListener('mousedown', e => { down = true; apply(e); });
cv.addEventListener('mousemove', e => { if (down) apply(e); });
addEventListener('mouseup', () => down = false);
document.getElementById('clear').onclick = () => { grid.fill(0); age.fill(0); draw(); };
document.getElementById('play').onclick = e => { running = !running; e.target.textContent = running ? 'Pause' : 'Play'; };

img.onload = draw;
setInterval(() => { if (running) { step(); draw(); } }, 120);
draw();
</script>
</body>
</html>
